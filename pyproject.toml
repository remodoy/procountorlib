[project]
name = "procountorlib"
version = "1.0.3"
authors = [
  { name="Antti Kettuneva"},
]
description = "A Python Procountor API library"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.34.2",
    "simplejson>=4.3.0",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/remodoy/procountorlib"
Issues = "https://github.com/remodoy/procountorlib/issues"
Repository = "https://github.com/remodoy/procountorlib.git"
